version: '3.1'

services:
  java-env:
    image: "irccs/19-jdk-slim"
    volumes:
      - ./services/:/home

  fhir-server:
    image: irccs/fhir-server:1.0.1
    restart: on-failure
    environment:
      hapi.fhir.allow_external_references: "true"
    ports:
      - "8080:8080"
  cache:
    image: redis:7.0-rc
    ports:
      - 6379:6379
    command: >
      --requirepass password

  httpd:
    image: irccs/httpd:2.4.46
    volumes:
      - ./html/:/usr/local/apache2/htdocs
    ports:
      - 80:80