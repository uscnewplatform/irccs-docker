networks:
  irccs:
    driver: bridge

services:

  postgres-keycloak:
    image: postgres
    hostname: postgres
    container_name: postgres-keycloak
    restart: always
    volumes:
      - postgres_data_keycloak:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_owner
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    networks:
      - irccs

  postgres-hapi-fhir:
    image: postgres:16.8
    hostname: postgres
    container_name: postgres-hapi-fhir
    restart: always
    volumes:
      - postgres_data_hapi:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - irccs

  irccs-keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: irccs-keycloak
    environment:
      KEYCLOAK_ADMIN: keycloak
      KEYCLOAK_ADMIN_PASSWORD: keycloak
      KC_DB_URL: jdbc:postgresql://postgres-keycloak/keycloak
      KC_DB_KIND: postgres
      # KC_DB_DRIVER: org.postgresql.Driver
      KEYCLOAKCLI_ADMIN: keycloak
      KEYCLOAKCLI_PASSWORD: keycloak
      #      KC_HTTPS_PROTOCOLS: TLSv1.3,TLSv1.2
      KC_DB: postgres
      KC_DB_USERNAME: keycloak_owner
      KC_DB_PASSWORD: password
      #KC_HOSTNAME: backoffice.irccs.infocube.it #non può andare insieme ad hostname_url
      KC_LOG_LEVEL: info
      KEYCLOAK_ENABLE_HTTPS: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_BACKCHANNEL-DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KC_PROXY_HEADERS: forwarded

    restart: always
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/opt/keycloak/bin/kc.sh build --db postgres && /opt/keycloak/bin/kc.sh start-dev --import-realm -Dkeycloak.migration.strategy=OVERWRITE_EXISTING",
      ]
    ports:
      - 9445:8080
    volumes:
      - ./keycloak-config/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ./keycloak-config/realm-export:/opt/keycloak/data/import
      - ./providers:/opt/keycloak/providers
    depends_on:
      - postgres-keycloak
    networks:
      - irccs  

  irccs-hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: irccs-hapi-fhir
    environment:
      SPRING_CONFIG_LOCATION: '/home/application.yaml'
    ports:
      - "8081:8080"
    volumes:
      - ./hapi-fhir-config/application.yaml:/home/application.yaml
    depends_on:
      - postgres-hapi-fhir
    networks:
      - irccs

volumes:
  postgres_data_hapi:
  postgres_data_keycloak:
