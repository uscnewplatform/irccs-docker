networks:
  irccs:
    driver: bridge

services:
  irccs-microservice-auth:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-auth:1.0.0-R5-RELEASE
    container_name: irccs-auth
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true

  irccs-microservice-ctcae:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-ctcae:1.0.0-R5-RELEASE
    container_name: irccs-ctcae
    volumes:
      - ./microservice-config/application.properties.ctcae:/deployments/config/application.properties
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true
 
  irccs-microservice-practitioner:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-practitioner:1.0.0-R5-RELEASE
    container_name: irccs-practitioner
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true
 
  irccs-microservice-centro-ricerca:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-centro-ricerca:1.0.0-R5-RELEASE
    container_name: irccs-centro-ricerca
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true

  irccs-microservice-studio-clinico:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-studio-clinico:1.0.0-R5-RELEASE
    container_name: irccs-studio-clinico
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true
  
  irccs-microservice-anagrafica-pazienti:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-anagrafica-pazienti:1.0.0-R5-RELEASE
    container_name: irccs-anagrafica-pazienti
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true

  irccs-httpd:
    image: nexus.infocube.it:443/i3/irccs/irccs-httpd-dashboard/1.0.0_r5_release:1.0.0-R5-RELEASE
    container_name: irccs-httpd-dashboard
    ports:
      - "80:80"
    volumes:
      - ./httpd-config/irccs.conf:/usr/local/apache2/conf/sites/irccs.conf
      - ./httpd-config/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./hapi-fhir-config/install_searchparameters.sh:/usr/local/apache2/install_searchparameters.sh
    entrypoint: ["/bin/sh", "-c", "apt-get update && apt-get install -y curl && while ! curl -sSf http://irccs-hapi-fhir:8080/fhir/metadata >/dev/null; do echo 'Waiting for HAPI FHIR...'; sleep 5; done && /usr/local/apache2/install_searchparameters.sh irccs-hapi-fhir:8080 && httpd-foreground"]
    networks:
      - irccs
      
  postgres-keycloak:
    image: postgres:17.4
    hostname: postgres
    container_name: postgres-keycloak
    restart: always
    volumes:
      - postgres_data_keycloak:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_owner
      POSTGRES_PASSWORD: password
    networks:
      - irccs

  irccs-keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: irccs-keycloak
    environment:
      KEYCLOAK_ADMIN: gennaro.aurilia@gmail.com
      KEYCLOAK_ADMIN_PASSWORD: Qwerty123!
    restart: always
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/opt/keycloak/bin/kc.sh build --db postgres && /opt/keycloak/bin/kc.sh start-dev --import-realm -Dkeycloak.migration.strategy=OVERWRITE_EXISTING",
      ]
    ports:
      - 9445:8080
      - 9000:9000
    volumes:
      - ./keycloak-config/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ./keycloak-config/realm-export:/opt/keycloak/data/import
      - ./keycloak-config/realm-export:/export
      - ./keycloak-config/providers/:/opt/keycloak/providers/
    depends_on:
      - postgres-keycloak
    networks:
      - irccs  
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 10

  irccs-hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: irccs-hapi-fhir
    ports:
      - "8080:8080"    
    depends_on:
      - postgres-hapi-fhir
    volumes:
      - ./hapi-fhir-config/application.yaml:/home/application.yaml
    environment:
      SPRING_CONFIG_LOCATION: '/home/application.yaml'
    networks:
      - irccs

  postgres-hapi-fhir:
    image: postgres:16.8
    hostname: postgres
    container_name: postgres-hapi-fhir
    restart: always
    volumes:
      - postgres_data_hapi:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    networks:
      - irccs 

  cache:
    container_name: irccs-redis
    hostname: redis
    image: redis:7.0-rc
    networks:
      - irccs
    command: --requirepass password
    volumes:
      - redis_data:/data

 
volumes:
  postgres_data_hapi:
  postgres_data_keycloak: 
  redis_data:
