networks:
  irccs:
    driver: bridge

services:
  irccs-microservice-auth:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-auth:1.0.0-SNAPSHOT
    container_name: irccs-auth
    ports:
      - "9090:8080"
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true
  
  irccs-microservice-practitioner:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-practitioner:1.0.0-SNAPSHOT
    container_name: irccs-practitioner
    ports:
      - "8384:8080"
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true
 
  irccs-microservice-centro-ricerca:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-centro-ricerca:1.0.0-SNAPSHOT
    container_name: irccs-centro-ricerca
    ports:
      - "8181:8080"
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true

  irccs-microservice-studio-clinico:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-studio-clinico:1.0.0-SNAPSHOT
    container_name: irccs-studio-clinico
    ports:
      - "8686:8080"
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true
  
  irccs-microservice-anagrafica-pazienti:
    image: nexus.infocube.it:443/org.quarkus/irccs-microservice-anagrafica-pazienti:1.0.0-SNAPSHOT
    container_name: irccs-anagrafica-pazienti
    ports:
      - "8282:8080"
    volumes:
      - ./microservice-config:/deployments/config
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
        restart: true

  irccs-httpd:
    image: nexus.infocube.it:443/i3/irccs/irccs-httpd-dashboard/pastrl-431:2.0.0
    container_name: irccs-httpd-dashboard
    ports:
      - "80:80"
    volumes:
      - ./httpd-config/irccs.conf:/usr/local/apache2/conf/sites/irccs.conf
      - ./httpd-config/httpd.conf:/usr/local/apache2/conf/httpd.conf
    networks:
      - irccs
      
  postgres-keycloak:
    image: postgres
    hostname: postgres
    container_name: postgres-keycloak
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_owner
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    networks:
      - irccs

  irccs-keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: irccs-keycloak
    environment:
      KEYCLOAK_ADMIN: gennaro.aurilia@gmail.com
      KEYCLOAK_ADMIN_PASSWORD: Qwerty123!
    restart: always
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/opt/keycloak/bin/kc.sh build --db postgres && /opt/keycloak/bin/kc.sh start-dev --import-realm -Dkeycloak.migration.strategy=OVERWRITE_EXISTING",
      ]
    ports:
      - 9445:8080
      - 9000:9000
    volumes:
      - ./keycloak-config/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ./keycloak-config/realm-export:/opt/keycloak/data/import
      - ./keycloak-config/realm-export:/export
      - ./keycloak-config/providers/:/opt/keycloak/providers/
    depends_on:
      - postgres-keycloak
    networks:
      - irccs  
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5

  irccs-hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: irccs-hapi-fhir
    ports:
      - "8080:8080"    
    volumes:
      - ./hapi-fhir-config/application.yaml:/home/application.yaml
    networks:
      - irccs

volumes:
  postgres_data:
  php_data:
  keycloak_data:
