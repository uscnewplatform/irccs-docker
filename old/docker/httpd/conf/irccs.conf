<VirtualHost *:80>
    #ServerName 172.18.0.3
	ServerAdmin salvatore.turboli@infocube.it
	DocumentRoot /usr/local/apache2/htdocs

	<Directory "/usr/local/apache2/htdocs">
		Order allow,deny
		AllowOverride All
		Allow from all
		Require all granted
	</Directory>

    #Load the SSL module that is needed to terminate SSL on Apache
    LoadModule ssl_module modules/mod_ssl.so

    #This directive toggles the usage of the SSL/TLS Protocol Engine for proxy. Without this you cannot use HTTPS URL as your Origin Server
    SSLProxyEngine on

    # To prevent SSL Offloading
    # Set the X-Forwarded-Proto to be https for your Origin Server to understand that this request is made over HTTPS #https://httpd.apache.org/docs/2.2/mod/mod_headers.html#requestheader.
    RequestHeader set X-Forwarded-Proto “https”
    RequestHeader set X-Forwarded-Port “443”

    ErrorLog logs/httpd-error.log
    CustomLog logs/httpd-access.log combined

    ProxyPass /Organization http://java-env:8181/fhir/Organization
    ProxyPassReverse /Organization http://java-env:8181/fhir/Organization

    ProxyPass /Patient http://java-env:8282/fhir/Patient
    ProxyPassReverse /Patient http://java-env:8282/fhir/Patient

    ProxyPass /ResearchStudy http://java-env:8686/fhir/ResearchStudy
    ProxyPassReverse /ResearchStudy http://java-env:8686/fhir/ResearchStudy

    ProxyPass /Questionnaire http://java-env:8686/fhir/Questionnaire
    ProxyPassReverse /Questionnaire http://java-env:8686/fhir/Questionnaire

    ProxyPass /PlanDefinition http://java-env:8686/fhir/PlanDefinition
    ProxyPassReverse /PlanDefinition http://java-env:8686/fhir/PlanDefinition

    ProxyPass /Procedure http://java-env:8686/fhir/Procedure
    ProxyPassReverse /Procedure http://java-env:8686/fhir/Procedure

    ProxyPass /CarePlan http://java-env:8686/fhir/CarePlan
    ProxyPassReverse /CarePlan http://java-env:8686/fhir/CarePlan

    ProxyPass /DiagnosticReport http://java-env:8686/fhir/DiagnosticReport
    ProxyPassReverse /DiagnosticReport http://java-env:8686/fhir/DiagnosticReport

    ProxyPass /Group http://java-env:8181/fhir/Group
    ProxyPassReverse /Group http://java-env:8181/fhir/Group

    ProxyPass /Appointment http://java-env:8686/fhir/Appointment
    ProxyPassReverse /Appointment http://java-env:8686/fhir/Appointment

    ProxyPass /Practitioner http://java-env:8384/fhir/Practitioner
    ProxyPassReverse /Practitioner http://java-env:8384/fhir/Practitioner

    ProxyPass /api/service/ http://java-env:8999/fhir/api/service/
    ProxyPassReverse /api/service/ http://java-env:8999/fhir/api/service/

    ProxyPass /HealthcareService http://java-env:8181/fhir/HealthcareService
    ProxyPassReverse /HealthcareService http://java-env:8181/fhir/HealthcareService

    ProxyPass /PractitionerRole http://java-env:8384/fhir/PractitionerRole
    ProxyPassReverse /PractitionerRole http://java-env:8384/fhir/PractitionerRole

    ProxyPass /Consent http://java-env:8585/fhir/Consent
    ProxyPassReverse /Consent http://java-env:8585/fhir/Consent

</VirtualHost>

