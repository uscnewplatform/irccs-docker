version: '3.1'

services:
  hapi-fhir-jpaserver-start:
    image: irccs/fhir-server:1.0.2
    restart: on-failure
    environment:
      hapi.fhir.allow_external_references: "true"
    ports:
      - "8080:8080"

  db:
    image: irccs/postgres:alpine3.18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example

  mysql:
    image: "mysql:5.6"
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: irccs
      MYSQL_PASSWORD: irccs

  cache:
    image: redis:7.0-rc
    ports:
      - 6379:6379
    command: >
      --requirepass password
