version: '3.8'

services:
  irccs-centro-ricerca:
    container_name: irccs-microservice-studio-clinico
    image: nexus.infocube.it/org.quarkus/irccs-microservice-studio-clinico:1.0.0-SNAPSHOT
    restart: always
    ports:
      - 8080
    networks:
      - irccs-docker_default
    volumes:
      - ./config:/deployments/config
networks:
  irccs-docker_default:
    external: true

