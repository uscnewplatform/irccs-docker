# Variante LAB del fallback host-level: niente TLS, porta 80, coerente con
# irccs-docker/httpd-config/irccs.conf che qui usa VirtualHost *:80 (no cert).
# Usare questo file in ambiente di lab/test; in produzione usare
# nginx-maintenance.conf (porta 443 + certificati reali).
#
# Installazione: copiare in /etc/nginx/sites-available/irccs-maintenance-vhost.conf
# (nome fisso, richiamato via "include" da nginx-maintenance-standalone.conf).
# NON linkare in sites-enabled del nginx "principale" -> resta dormiente
# finche' non viene avviato esplicitamente (vedi systemd unit).

server {
    listen 80;
    listen [::]:80;
    server_name irccs.infocube.it;

    root /opt/irccs-maintenance;
    index maintenance.html;

    add_header Retry-After "3600" always;

    location / {
        return 503;
    }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }
}
