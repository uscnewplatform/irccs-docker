# Variante PRODUZIONE (TLS, porta 443) del fallback host-level: usato SOLO
# quando lo stack Docker (irccs-httpd incluso) e' fermo/in aggiornamento,
# quindi la porta 443 e' libera. Non gira mai in parallelo con
# irccs-httpd-dashboard (stessa porta 443).
# In ambiente di lab/test usare invece nginx-maintenance-lab.conf (porta 80,
# no TLS), coerente con VirtualHost *:80 di quell'ambiente.
#
# Installazione: copiare in /etc/nginx/sites-available/irccs-maintenance-vhost.conf
# (nome fisso, richiamato via "include" da nginx-maintenance-standalone.conf).
# NON linkare in sites-enabled del nginx "principale" -> resta dormiente
# finche' non viene avviato esplicitamente (vedi systemd unit).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pj.istitutotumori.na.it;

    ssl_certificate     /home/savioadmin/cert-pasc-2026-fullchain.crt;
    ssl_certificate_key /home/savioadmin/cert-pasc-2026.key;

    root /opt/irccs-maintenance;
    index maintenance.html;

    add_header Retry-After "3600" always;

    location / {
        return 503;
    }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
    }
}
