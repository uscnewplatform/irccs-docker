# Config nginx STANDALONE (non un frammento vhost): questo e' il file che la
# unit systemd passa a "nginx -c", quindi deve contenere events{}/http{} come
# un nginx.conf completo, non solo un blocco server{}.
#
# Include il vhost giusto in base all'ambiente: di default punta al file lab
# (porta 80, no TLS). In produzione, cambiare la riga "include" per puntare a
# irccs-maintenance-vhost-prod.conf (porta 443 + TLS).
#
# Installazione: copiare in /etc/nginx/irccs-maintenance-standalone.conf

worker_processes 1;
pid /run/irccs-maintenance.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/irccs-maintenance-access.log;
    error_log  /var/log/nginx/irccs-maintenance-error.log;

    # LAB (porta 80, no TLS):
    include /etc/nginx/sites-available/irccs-maintenance-vhost.conf;
}
