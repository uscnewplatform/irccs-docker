quarkus.http.port=8080
# Variables
quarkus.log.level=INFO
quarkus.rest-client.auth-microservice-client.url=http://irccs-auth:8080

# Keycloak Variables
keycloak-port=8080
keycloak-base-url=http://irccs-keycloak:${keycloak-port}

# Keycloak Configuration
keycloak-client_id=${KEYCLOAK_CLIENT_ID}
keycloak-client_secret=${KEYCLOAK_CLIENT_SECRET}
keycloak-realm=${KEYCLOAK_REALM}
keycloak-admin-username=${KEYCLOAK_ADMIN}
keycloak-admin-password=${KEYCLOAK_ADMIN_PASSWORD}

quarkus.http.cors.exposed-headers=Content-Disposition, Authorization
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, content-disposition

# FHIR / audit trail: gli accessi ai ticket Zammad (che possono contenere dati paziente)
# sono scritti come AuditEvent sullo store di audit isolato (ZammadTicketAuditFilter).
# fhir-server serve solo a soddisfare il producer di FhirClient, l'uso reale e' l'audit store.
org.quarkus.irccs.fhir-server=http://irccs-hapi-fhir:8080/fhir
org.quarkus.irccs.query.limit=100
org.quarkus.irccs.audit-fhir-server=http://irccs-hapi-audit:8080/fhir
org.quarkus.irccs.audit-site=irccs-pascale

# ZAMMAD CONFIG
zammad.base-url=${ZAMMAD_BASE_URL}
zammad.token=${ZAMMAD_TOKEN_SERVICE}

# KC Auth Server Url
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER}

zammad.sync.interval=${ZAMMAD_INTERVAL_POLLING}
zammad.admin.email=${ZAMMAD_ADMIN_EMAIL}
quarkus.rest-client.zammad-api.url=${ZAMMAD_BASE_URL}

