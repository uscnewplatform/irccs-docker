quarkus.http.port=8080
quarkus.log.level=INFO

# OIDC token verification
quarkus.oidc.auth-server-url=${OIDC_TOKEN_ISSUER}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER}

# PostgreSQL — subscription push anonimizzate
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${WEBPUSH_DB_URL:jdbc:postgresql://postgres-keycloak:5432/webpush}
quarkus.datasource.username=${WEBPUSH_DB_USER}
quarkus.datasource.password=${WEBPUSH_DB_PASSWORD}

# Chiavi crittografiche per anonimizzazione
webpush.crypto.hmac-secret=${WEBPUSH_HMAC_SECRET}
webpush.crypto.encrypt-key=${WEBPUSH_ENCRYPT_KEY}

# FHIR Server
org.quarkus.irccs.fhir-server=http://irccs-hapi-fhir:8080/fhir
org.quarkus.irccs.query.limit=100000

# Intervallo cronjob reminder questionari (es. 10s, 5m, 1h)
webpush.scheduler.interval=10s

translations.path=/deployments/translations

# VAPID keys — generare con: npx web-push generate-vapid-keys
webpush.vapid.subject=mailto:admin@pascale.it
webpush.vapid.public-key=${VAPID_PUBLIC_KEY}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY}
