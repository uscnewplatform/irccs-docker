quarkus.http.port=8080
quarkus.log.level=INFO

# OIDC token verification
quarkus.oidc.auth-server-url=${OIDC_TOKEN_ISSUER}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER}

# Redis — storage subscription push (patientId → dispositivi)
quarkus.redis.hosts=${REDIS_HOST:redis://cache:6379}
quarkus.redis.password=${REDIS_PASSWORD}

# VAPID keys — generare con: npx web-push generate-vapid-keys
webpush.vapid.subject=mailto:admin@pascale.it
webpush.vapid.public-key=${VAPID_PUBLIC_KEY}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY}
