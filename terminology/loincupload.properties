# LOINC upload properties per HAPI FHIR
# Testato con LOINC 2.82 e HAPI FHIR 8.6.8
#
# A partire da LOINC 2.77, il file MultiAxialHierarchy.csv e' stato sostituito
# da ComponentHierarchyBySystem.csv e tutti i file sono dentro una cartella
# con il numero di versione (es. Loinc_2.82/).
# Questo file mappa i path reali del ZIP ai nomi attesi da HAPI FHIR.
#
# AGGIORNAMENTO: se si aggiorna LOINC, sostituire il prefisso Loinc_2.82/
# con la nuova versione (es. Loinc_2.83/) in tutte le righe seguenti.

loinc.csv.file=Loinc_2.82/LoincTable/Loinc.csv
loinc.hierarchy.file=Loinc_2.82/AccessoryFiles/ComponentHierarchyBySystem/ComponentHierarchyBySystem.csv
loinc.answerlist.file=Loinc_2.82/AccessoryFiles/AnswerFile/AnswerList.csv
loinc.answerlist-link.file=Loinc_2.82/AccessoryFiles/AnswerFile/LoincAnswerListLink.csv
loinc.part.file=Loinc_2.82/AccessoryFiles/PartFile/Part.csv
loinc.part-link-primary.file=Loinc_2.82/AccessoryFiles/PartFile/LoincPartLink_Primary.csv
loinc.part-link-supplementary.file=Loinc_2.82/AccessoryFiles/PartFile/LoincPartLink_Supplementary.csv
loinc.part-related-code-mapping.file=Loinc_2.82/AccessoryFiles/PartFile/PartRelatedCodeMapping.csv
loinc.group.file=Loinc_2.82/AccessoryFiles/GroupFile/Group.csv
loinc.group-term.file=Loinc_2.82/AccessoryFiles/GroupFile/GroupLoincTerms.csv
loinc.parent-group.file=Loinc_2.82/AccessoryFiles/GroupFile/ParentGroup.csv
loinc.document-ontology.file=Loinc_2.82/AccessoryFiles/DocumentOntology/DocumentOntology.csv
loinc.rsna-playbook.file=Loinc_2.82/AccessoryFiles/LoincRsnaRadiologyPlaybook/LoincRsnaRadiologyPlaybook.csv
loinc.universal-lab-order-valueset.file=Loinc_2.82/AccessoryFiles/LoincUniversalLabOrdersValueSet/LoincUniversalLabOrdersValueSet.csv
loinc.ieee-medical-device-code.file=Loinc_2.82/AccessoryFiles/LoincIeeeMedicalDeviceCodeMappingTable/LoincIeeeMedicalDeviceCodeMappingTable.csv
loinc.imaging-document-codes.file=Loinc_2.82/AccessoryFiles/ImagingDocuments/ImagingDocumentCodes.csv
loinc.linguistic-variants.file=Loinc_2.82/AccessoryFiles/LinguisticVariants/LinguisticVariants.csv