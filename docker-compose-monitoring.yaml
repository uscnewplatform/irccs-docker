x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:

  grafana:
    image: "grafana/grafana:${GRAFANA_VERSION:-latest}"
    container_name: irccs-grafana
    logging: *default-logging
    env_file:
      - "./.env"
    volumes:
      - "${GRAFANA_CONFIG_PATH_LOCAL}:${GRAFANA_CONFIG_PATH}/${GRAFANA_CONFIG_FILE}"
      - "${GRAFANA_DATASOURCES_PATH_LOCAL}:${GRAFANA_DATASOURCES_PATH}"
      - "${GRAFANA_DASHBOARDS_PROVISIONING_PATH_LOCAL}:${GRAFANA_DASHBOARDS_PROVISIONING_PATH}"
      - "${GRAFANA_DASHBOARDS_PATH_LOCAL}:${GRAFANA_DASHBOARDS_PATH}"
      - "${GRAFANA_ALERTING_PATH_LOCAL}:${GRAFANA_ALERTING_PATH}"
      #- '${GRAFANA_PLUGINS_PATH_LOCAL}:${GRAFANA_PLUGINS_PATH}'
      #- '${GRAFANA_PLUGINS_PROVISIONING_PATH_LOCAL}:${GRAFANA_PLUGINS_PROVISIONING_PATH}'
    entrypoint:
      - "${GRAFANA_HOME_PATH}/bin/grafana-server"
      - "--homepath=${GRAFANA_HOME_PATH}"
      - "--config=${GRAFANA_CONFIG_PATH}/${GRAFANA_CONFIG_FILE}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_FROM=${GF_SMTP_FROM}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN}
    # In produzione niente porta host diretta: si passa da httpd reverse proxy
    # sulla rete "irccs" (vedi httpd-config/irccs.conf, route /grafana).
    # Per test locale isolato si puo' scommentare la porta sotto.
    # ports:
    #   - "${GRAFANA_PORT}:3000"
    networks:
      - monitoring_stack_network
      - irccs

  loki:
    env_file:
      - "./.env"
    image: "grafana/loki:3.5"
    container_name: irccs-loki
    logging: *default-logging
    command: "-config.file=${LOKI_CONFIG_PATH}/${LOKI_CONFIG_FILE}"
    # Nessuna esposizione host: Loki e' raggiunto solo da Grafana/Alloy sulla
    # rete interna monitoring_stack_network.
    volumes:
      - "${LOKI_CONFIG_PATH_LOCAL}:${LOKI_CONFIG_PATH}/${LOKI_CONFIG_FILE}"
      - type: volume
        source: loki_data
        target: /loki
#    depends_on:
#      - "minio"
    networks:
      - monitoring_stack_network
  alloy:
    env_file:
      - "./.env"
    image: "grafana/alloy:v1.11.3"
    container_name: irccs-alloy
    logging: *default-logging
    privileged: true
    volumes:
      - '${ALLOY_CONFIG_PATH_LOCAL}:${ALLOY_CONFIG_PATH}/${ALLOY_CONFIG_FILE}'
      - '/:/rootfs:ro'
      - '/var/run:/var/run'
      - '/sys:/sys:ro'
      - '/var/lib/docker:/var/lib/docker:ro'
      - '/dev/disk:/dev/disk:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - '/proc:/proc:ro'
    entrypoint:
      - "/bin/alloy"
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - '--config.extra-args="-config.expand-env"'
      - "${ALLOY_CONFIG_PATH}/${ALLOY_CONFIG_FILE}"
    # UI debug Alloy solo su loopback host, mai esposta pubblicamente. Il
    # receiver Faro (frontend) NON e' esposto su porta host: raggiungibile
    # solo via httpd reverse proxy sulla rete "irccs" (vedi irccs.conf,
    # route /faro-collector). OTEL/pyroscope restano disattivi (fase 2).
    ports:
      - "127.0.0.1:${AGENT_PORT}:${AGENT_PORT}"
    depends_on:
      - "grafana"
      - "loki"
    networks:
      - monitoring_stack_network
      - irccs


networks:
  monitoring_stack_network:
    driver: bridge
  irccs:
    external: true

volumes:
  loki_data:
