  irccs-microservice-patient-interview:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-patient-interview:${IRCCS_PATIENT_INTERVIEW_VERSION}
    container_name: irccs-patient-interview
    volumes:
      - ./microservice-config:/deployments/config
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

volumes:
  postgres_data_hapi:
  postgres_data_hapi_audit:
  postgres_data_keycloak:
  redis_data:
  elasticsearch_data:
  audit_integrity_state:
