networks:
  irccs:
    name: irccs
    driver: bridge
  # Rete interna dedicata al DB dell'audit store: solo postgres-hapi-audit e
  # irccs-hapi-audit ci stanno sopra. Sulla rete flat `irccs` isolamento
  # dell'audit store = solo credenziali (qualunque microservizio compromesso
  # con le credenziali giuste raggiungerebbe postgres-hapi-audit:5432
  # direttamente, bypassando l'append-only/hash-chain di HAPI). `internal: true`
  # nega anche l'uscita verso l'esterno - non serve, nulla qui deve chiamare
  # fuori dallo stack.
  irccs-audit-db:
    name: irccs-audit-db
    driver: bridge
    internal: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  irccs-microservice-clinical-reasoning:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-clinical-reasoning:${IRCCS_CLINICAL_REASONING_VERSION}
    container_name: irccs-clinical-reasoning
    volumes:
      - ./microservice-config:/deployments/config
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-auth:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-auth:${IRCCS_AUTH_VERSION}
    container_name: irccs-auth
    volumes:
      - ./microservice-config:/deployments/config
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-notification:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-notification:${IRCCS_NOTIFICATION_VERSION}
    container_name: irccs-notification
    volumes:
      - ./microservice-config-notification/application.properties:/deployments/config/application.properties
    env_file:
      - .env
    ports:
      - "8987:8080"
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-practitioner:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-practitioner:${IRCCS_PRACTITIONER_VERSION}
    container_name: irccs-practitioner
    volumes:
      - ./microservice-config:/deployments/config
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-centro-ricerca:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-centro-ricerca:${IRCCS_CENTRO_RICERCA_VERSION}
    container_name: irccs-centro-ricerca
    volumes:
      - ./microservice-config:/deployments/config
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-studio-clinico:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-studio-clinico:${IRCCS_STUDIO_CLINICO_VERSION}
    container_name: irccs-studio-clinico
    volumes:
      - ./microservice-config:/deployments/config
      - ./translations:/deployments/translations
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-anagrafica-pazienti:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-anagrafica-pazienti:${IRCCS_ANAGRAFICA_VERSION}
    container_name: irccs-anagrafica-pazienti
    ports:
      - "8976:8080"
    volumes:
      - ./microservice-config:/deployments/config
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-httpd:
    # Il tag Docker pushato da Gui-Jenkinsfile include il nome del branch che ha
    # buildato l'immagine (nexus.infocube.it/.../irccs-httpd-dashboard/<branch>:<versione>,
    # da package.json). IRCCS_HTTPD_BRANCH (default develop) seleziona quale branch
    # pullare - utile per testare un'immagine da un feature branch non ancora
    # mergiato senza editare questo file a mano.
    image: nexus.infocube.it/i3/irccs/irccs-httpd-dashboard/${IRCCS_HTTPD_BRANCH:-develop}:${IRCCS_HTTPD_VERSION}
    container_name: irccs-httpd-dashboard
    ports:
      - "443:443"
    volumes:
      - ./httpd-config/irccs.conf:/usr/local/apache2/conf/sites/irccs.conf
      - ./httpd-config/zammad.conf:/usr/local/apache2/conf/sites/zammad.conf
      - ./httpd-config/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./httpd-config/config-prod.js:/usr/local/apache2/htdocs/config.js
      - ./httpd-config/manuale-cliente:/usr/local/apache2/htdocs/manuale-cliente #documentazione antora
      - ./httpd-config/maintenance.html:/usr/local/apache2/htdocs/maintenance.html:ro
      - ./httpd-config/.maintenance-flag:/usr/local/apache2/htdocs/.maintenance-flag #vuoto=sito attivo, non vuoto=manutenzione
      - /home/savioadmin/cert-pasc-2026-fullchain.crt:/usr/local/apache2/conf/ssl/cert-pasc-2026.crt:ro
      - /home/savioadmin/cert-pasc-2026.key:/usr/local/apache2/conf/ssl/cert-pasc-2026.key:ro
    networks:
      - irccs
  postgres-keycloak:
    image: postgres:${POSTGRES_KEYCLOAK_VERSION}
    hostname: postgres
    container_name: postgres-keycloak
    restart: always
    logging: *default-logging
    volumes:
      - postgres_data_keycloak:/var/lib/postgresql/data
      - ./microservice-config-webpush/postgres-init:/docker-entrypoint-initdb.d
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    networks:
      - irccs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_KEYCLOAK_USER} -d ${POSTGRES_KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  irccs-keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_IMAGE_VERSION}
    container_name: irccs-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${POSTGRES_KEYCLOAK_DB}
      PROXY_ADDRESS_FORWARDING: "true"
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL}
      #KC_HOSTNAME_STRICT: true
      #KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /backoffice
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
    env_file:
      - .env
    restart: always
    logging: *default-logging
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/opt/keycloak/bin/kc.sh build --db postgres && /opt/keycloak/bin/kc.sh start --hostname ${KC_HOSTNAME} --http-relative-path /backoffice --hostname-backchannel-dynamic true --import-realm -Dkeycloak.migration.strategy=OVERWRITE_EXISTING"
      ]
    ports:
      - "127.0.0.1:9445:8080"
    volumes:
      - ./keycloak-config/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ./keycloak-config/realm-export:/opt/keycloak/data/import
      - ./keycloak-config/realm-export:/export
      - ./keycloak-config/providers/:/opt/keycloak/providers/
    depends_on:
      - postgres-keycloak
    networks:
      - irccs
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 10

  irccs-hapi-fhir:
    image: hapiproject/hapi:${HAPI_IMAGE_VERSION}
    container_name: irccs-hapi-fhir
    ports:
      - "8080:8080"
    depends_on:
      - postgres-hapi-fhir
    volumes:
      - ./hapi-fhir-config/application.yaml:/home/application.yaml
      - ./terminology:/terminology
      - ./hapi-fhir-config/lucenefiles:/lucenefiles
      # Audit trail Fase 1: interceptor (partizione AUDIT + append-only + hash-chain).
      # /app/extra-classes/ e' gia' in -Dloader.path nell'entrypoint dell'immagine
      # hapiproject/hapi (LOADER_PATH come env NON basta). Il jar e' un artefatto buildato
      # da irccs-common/hapi-audit-interceptor, committato qui come i provider Keycloak.
      - ./hapi-fhir-config/interceptors/audit-partition-interceptor.jar:/app/extra-classes/audit-partition-interceptor.jar
    environment:
      SPRING_CONFIG_LOCATION: '/home/application.yaml'
    env_file:
      - .env
    networks:
      - irccs

  postgres-hapi-fhir:
    image: postgres:${POSTGRES_HAPI_VERSION}
    hostname: postgres
    container_name: postgres-hapi-fhir
    restart: always
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - postgres_data_hapi:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${HAPI_DB_NAME}
      POSTGRES_USER: ${HAPI_DB_USER}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD}
    networks:
      - irccs

  # ---- Audit trail: store FHIR fisicamente separato ------------------------
  # Postgres + HAPI dedicati agli AuditEvent (storage, account, backup indipendenti
  # da quelli clinici). I microservizi ci scrivono via org.quarkus.irccs.audit-fhir-server.
  postgres-hapi-audit:
    build:
      context: ./postgres-audit-image
      args:
        POSTGRES_HAPI_VERSION: ${POSTGRES_HAPI_VERSION}
    hostname: postgres-audit
    container_name: postgres-hapi-audit
    restart: always
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - postgres_data_hapi_audit:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${HAPI_AUDIT_DB_NAME}
      POSTGRES_USER: ${HAPI_AUDIT_DB_USER}
      POSTGRES_PASSWORD: ${HAPI_AUDIT_DB_PASSWORD}
    # pgaudit.log_catalog=off: senza, ogni query interna di HAPI sui cataloghi
    # di sistema finirebbe loggata - rumore puro, non e' l'accesso che vogliamo
    # tracciare. pgaudit.log_parameter resta OFF di default: loggherebbe i
    # valori dei parametri delle query (potenziali identificativi paziente) -
    # attivarlo e' un trade-off "piu' dettaglio forense" vs "nuova PII nei log
    # di Postgres", da decidere esplicitamente, non di default.
    command: >
      -c shared_preload_libraries=pgaudit
      -c pgaudit.log=read,write,role,ddl
      -c pgaudit.log_catalog=off
      -c pgaudit.log_parameter=off
    # SOLO irccs-audit-db: nessun microservizio clinico e' su questa rete,
    # quindi nessuno puo' aprire una connessione TCP diretta a questo Postgres
    # anche avendone le credenziali - deve passare per forza dall'API REST di
    # irccs-hapi-audit (append-only + hash-chain interceptor applicati li').
    networks:
      - irccs-audit-db

  irccs-hapi-audit:
    image: hapiproject/hapi:${HAPI_IMAGE_VERSION}
    container_name: irccs-hapi-audit
    ports:
      # Solo host-locale, per gli script di setup (install_searchparameters / db_protection).
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres-hapi-audit
    volumes:
      - ./hapi-audit-config/application.yaml:/home/application.yaml
      - ./hapi-fhir-config/lucenefiles-audit:/lucenefiles
      # Stesso jar dell'istanza clinica: qui carica solo append-only + hash-chain
      # (vedi custom-interceptor-classes in hapi-audit-config/application.yaml).
      - ./hapi-fhir-config/interceptors/audit-partition-interceptor.jar:/app/extra-classes/audit-partition-interceptor.jar
    environment:
      SPRING_CONFIG_LOCATION: '/home/application.yaml'
    env_file:
      - .env
    # Su entrambe le reti: irccs per essere raggiunto dai microservizi clinici
    # (org.quarkus.irccs.audit-fhir-server) e da irccs-audit-integrity;
    # irccs-audit-db per raggiungere il proprio Postgres, isolato dal resto.
    networks:
      - irccs
      - irccs-audit-db

  # Verifica continua della hash-chain degli AuditEvent (tamper-evidence a runtime).
  # Ricalcola in Python la stessa canonicalPayload/SHA-256 di
  # AuditEventHashChainInterceptor.java e confronta con l'hash memorizzato: rileva
  # manomissioni fatte direttamente sul DB (che i trigger non coprono al 100%),
  # cancellazioni/buchi e fork della catena. Incrementale ogni 15 min, full ogni ~24h.
  # Output -> Alloy -> Loki -> regole Grafana irccs-audit-integrity-*.
  # Nessuna dipendenza: lo script usa solo la stdlib di Python.
  irccs-audit-integrity:
    image: python:3.12-alpine
    container_name: irccs-audit-integrity
    restart: always
    logging: *default-logging
    depends_on:
      - irccs-hapi-audit
      - irccs-hapi-fhir
    volumes:
      - ./setup:/setup:ro
      - audit_integrity_state:/state
    environment:
      IRCCS_AUDIT_FHIR_URL: http://irccs-hapi-audit:8080/fhir
      IRCCS_CLINICAL_FHIR_URL: http://irccs-hapi-fhir:8080/fhir
      AUDIT_INTEGRITY_INTERVAL: ${AUDIT_INTEGRITY_INTERVAL:-900}
      AUDIT_INTEGRITY_FULL_EVERY: ${AUDIT_INTEGRITY_FULL_EVERY:-96}
      AUDIT_INTEGRITY_EXTRA_ARGS: ${AUDIT_INTEGRITY_EXTRA_ARGS:-}
      # Riconciliazione risorse orfane (verify_audit_coverage.py, stesso ciclo):
      # grace prima di considerare "orfana" una risorsa critica senza AuditEvent
      # corrispondente, per non generare falsi positivi sulle scritture in corso.
      AUDIT_COVERAGE_GRACE_SECONDS: ${AUDIT_COVERAGE_GRACE_SECONDS:-300}
      AUDIT_COVERAGE_EXTRA_ARGS: ${AUDIT_COVERAGE_EXTRA_ARGS:-}
    entrypoint: ["sh", "/setup/audit_integrity_loop.sh"]
    networks:
      - irccs

  cache:
    container_name: irccs-redis
    hostname: redis
    image: redis:${REDIS_VERSION}
    networks:
      - irccs
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  irccs-microservice-tac:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-tac:${IRCCS_TAC_VERSION}
    container_name: irccs-tac
    volumes:
      - ./microservice-config-tac:/deployments/config
      - ./dicom:/data
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-zammad:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-zammad:${IRCCS_ZAMMAD_VERSION}
    container_name: irccs-zammad
    volumes:
      - ./microservice-config-zammad:/deployments/config
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-microservice-webpush:
    image: nexus.infocube.it/org.quarkus/irccs-microservice-webpush:${IRCCS_WEBPUSH_VERSION}
    container_name: irccs-webpush
    hostname: irccs-webpush
    volumes:
      - ./microservice-config-webpush:/deployments/config
      - ./translations:/deployments/translations
    env_file:
      - .env
    networks:
      - irccs
    depends_on:
      irccs-keycloak:
        condition: service_healthy
      postgres-keycloak:
        condition: service_healthy
    restart: always
    logging: *default-logging

  irccs-antora-docs:
    image: nexus.infocube.it/i3/irccs/antora-docs:${IRCCS_ANTORA_DOCS_VERSION}
    container_name: irccs-antora-docs
    restart: always
    logging: *default-logging
    networks:
      - irccs

