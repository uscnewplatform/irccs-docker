# Variables
quarkus.log.level=INFO

# Questionnaire.identifier.system dei questionari PRO da notificare al paziente
# (push "Nuovo questionario disponibile"). Stessa env var del backend irccs-pwa
# e di irccs-microservice-webpush - tenerle allineate.
irccs.pro-questionnaire-systems=${IRCCS_PRO_QUESTIONNAIRE_SYSTEMS}
quarkus.rest-client.auth-microservice-client.url=http://irccs-auth:8080
quarkus.rest-client.webpush-microservice-client.url=http://irccs-webpush:8080
quarkus.rest-client.group-microservice-client.url=http://irccs-centro-ricerca:8080
quarkus.rest-client.practitioner-microservice-client.url=http://irccs-practitioner:8080
quarkus.rest-client.redis-microservice-client.url=http://irccs-notification:8080

# FHIR Server configuration
org.quarkus.irccs.fhir-server=http://irccs-hapi-fhir:8080/fhir
# Audit trail: gli AuditEvent vanno sullo store FHIR dedicato (irccs-hapi-audit),
# fisicamente separato da quello clinico. Se non impostata, si scrivono sullo stesso
# server di org.quarkus.irccs.fhir-server (comportamento pre-separazione).
org.quarkus.irccs.audit-fhir-server=http://irccs-hapi-audit:8080/fhir
org.quarkus.irccs.audit-site=irccs-pascale
# Interruttori audit trail lato microservizio (default: tutti attivi).
#   audit.enabled=false          -> nessun AuditEvent FHIR scritto (kill switch globale)
#   audit.read-enabled=false     -> non traccia le sole consultazioni (le scritture si')
#   audit.sensitive-resource-types=<CSV>        -> RIMPIAZZA l'elenco dei tipi con audit in lettura
#   audit.sensitive-resource-types.extra=<CSV>  -> AGGIUNGE tipi all'elenco di default
# Default dei tipi sensibili: Patient, Observation, DiagnosticReport, DocumentReference,
# Media, ImagingStudy, Condition, Procedure, Consent, ResearchSubject, AdverseEvent,
# QuestionnaireResponse, CarePlan, Encounter, Specimen, MedicationStatement,
# MedicationRequest, Immunization, AllergyIntolerance, FamilyMemberHistory,
# ClinicalImpression, RiskAssessment, Appointment
#org.quarkus.irccs.audit.enabled=true
#org.quarkus.irccs.audit.read-enabled=true
#org.quarkus.irccs.audit.sensitive-resource-types.extra=
org.quarkus.irccs.query.limit=1000
org.quarkus.irccs.socket.timeout=120000
org.quarkus.irccs.connection.timeout=120000
org.quarkus.irccs.connectionRequest.timeout=120000

# Accepted Headers
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, content-token, X-OTP-Code

# Keycloak Variables
keycloak-port=8080
keycloak-base-url=http://irccs-keycloak

# Keycloak Configuration
keycloak-client_id=${KEYCLOAK_CLIENT_ID}
keycloak-client_secret=${KEYCLOAK_CLIENT_SECRET}
keycloak-realm=${KEYCLOAK_REALM}
keycloak-admin-username=${KEYCLOAK_ADMIN}
keycloak-admin-password=${KEYCLOAK_ADMIN_PASSWORD}

# Enable Policy Enforcement
quarkus.keycloak.policy-enforcer.enable=true
quarkus.keycloak.policy-enforcer.paths.0.path=/fhir/auth/users/signup
quarkus.keycloak.policy-enforcer.paths.1.path=/fhir/auth/users/token
quarkus.keycloak.policy-enforcer.paths.2.path=/fhir/auth/users/logout
quarkus.keycloak.policy-enforcer.paths.3.path=/fhir/auth/users/forgotPassword
quarkus.keycloak.policy-enforcer.paths.4.path=/fhir/auth/users/updatePassword
quarkus.keycloak.policy-enforcer.paths.5.path=/fhir/auth/users/me
quarkus.keycloak.policy-enforcer.paths.6.path=/fhir/auth/users/organizations
quarkus.keycloak.policy-enforcer.paths.7.path=/fhir/auth/users/verify-email
quarkus.keycloak.policy-enforcer.paths.8.path=/fhir/auth/users/set-password
quarkus.keycloak.policy-enforcer.paths.0.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.1.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.2.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.3.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.4.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.5.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.6.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.7.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.8.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.9.path=/fhir/patients/*
quarkus.keycloak.policy-enforcer.paths.9.enforcement-mode=disabled
quarkus.keycloak.policy-enforcer.paths.10.enforcement-mode=DISABLED
quarkus.keycloak.policy-enforcer.paths.10.path=/fhir/zammad/*
quarkus.keycloak.policy-enforcer.http-method-as-scope=true

# PROMPTS secret
jwt.secret=${JWT_SECRET}

# KC Auth Server Url
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER}
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL}
mp.jwt.verify.publickey.location=${QUARKUS_OIDC_AUTH_SERVER_URL}/protocol/openid-connect/certs

translations.path=/deployments/translations

# Mailer: notifiche SAE al gruppo farmacovigilanza inviate da studio-clinico
# (QuestionnaireResponseFlow.sendEmailIfSae, via i3-mail). Stesse env var di notification.
quarkus.mailer.from=${quarkus.mailer.from}
quarkus.mailer.host=${quarkus.mailer.host}
quarkus.mailer.port=${quarkus.mailer.port}
quarkus.mailer.start-tls=${quarkus.mailer.start-tls}
quarkus.mailer.username=${quarkus.mailer.username}
quarkus.mailer.password=${quarkus.mailer.password}
quarkus.mailer.mock=false
app.mail.platform-url=${APP_PUBLIC_BASE_URL}
app.mail.help-desk-email=${APP_HELP_DESK_EMAIL}
