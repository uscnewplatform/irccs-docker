<VirtualHost *:443>
    #ServerName 172.18.0.3
    ServerName pj.istitutotumori.na.it
	ServerAdmin gennaro.aurilia@infocube.it
	DocumentRoot /usr/local/apache2/htdocs

	SSLEngine on
	SSLCertificateFile /usr/local/apache2/conf/ssl/cert-pasc-2026.crt
	SSLCertificateKeyFile /usr/local/apache2/conf/ssl/cert-pasc-2026.key
	<Directory "/usr/local/apache2/htdocs">
          Options Indexes FollowSymLinks
          AllowOverride All
          Require all granted
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_URI} !^/docs
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          # ===== REGOLE CACHE BUSTING (AGGIUNGI QUI) =====
          <IfModule mod_headers.c>
               # NO cache per index.html e config.js (runtime config, non hashato)
              <FilesMatch "^(index\.html|config\.js)$">
                  Header set Cache-Control "no-cache, no-store, must-revalidate"
                  Header set Pragma "no-cache"
                  Header set Expires 0
              </FilesMatch>

              # Cache aggressiva per asset statici con hash (esclude config.js)
              <FilesMatch "^(?!config\.js$).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">    Header set Cache-Control "max-age=31536000, public, immutable"
              </FilesMatch>

              # NO cache per config.js (config-prod.js montato come config.js, non hashato,
              # cambia senza rebuild) — deve stare DOPO la regola aggressiva sopra: con
              # "Header set" vince l'ultimo match applicato.
              <FilesMatch "^config\.js$">
                  Header set Cache-Control "no-cache, no-store, must-revalidate"
                  Header set Pragma "no-cache"
                  Header set Expires 0
              </FilesMatch>
          </IfModule>
	</Directory>

    LimitRequestBody 1073741824
    #This directive toggles the usage of the SSL/TLS Protocol Engine for proxy. Without this you cannot use HTTPS URL as your Origin Server
    SSLProxyEngine on

    # Manda al backend l'Host header originale del browser (pj.istitutotumori.na.it)
    # invece dell'hostname del container target. Serve a Zammad/Rails per calcolare
    # l'Origin corretto nel check CSRF (senza questo vede Host = irccs-zammad-nginx:8080
    # e fallisce sempre "CSRF token verification failed").
    ProxyPreserveHost On

    # To prevent SSL Offloading
    # Set the X-Forwarded-Proto to be https for your Origin Server to understand that this request is made over HTTPS #https://httpd.apache.org/docs/2.2/mod/mod_headers.html#requestheader.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog logs/httpd-error.log
    CustomLog logs/httpd-access.log combined

    ProxyPass /Organization http://irccs-centro-ricerca:8080/fhir/Organization
    ProxyPassReverse /Organization http://irccs-centro-ricerca:8080/fhir/Organization

    ProxyPass /Person http://irccs-centro-ricerca:8080/fhir/Person
    ProxyPassReverse /Person http://irccs-centro-ricerca:8080/fhir/Person

    ProxyPass /Observation http://irccs-anagrafica-pazienti:8080/fhir/Observation
    ProxyPassReverse /Observation http://irccs-anagrafica-pazienti:8080/fhir/Observation

    ProxyPass /Patient http://irccs-anagrafica-pazienti:8080/fhir/Patient
    ProxyPassReverse /Patient http://irccs-anagrafica-pazienti:8080/fhir/Patient

    ProxyPass /ResearchStudy http://irccs-studio-clinico:8080/fhir/ResearchStudy
    ProxyPassReverse /ResearchStudy http://irccs-studio-clinico:8080/fhir/ResearchStudy

    ProxyPass /Questionnaire http://irccs-studio-clinico:8080/fhir/Questionnaire
    ProxyPassReverse /Questionnaire http://irccs-studio-clinico:8080/fhir/Questionnaire

    ProxyPass /QuestionnaireResponse http://irccs-studio-clinico:8080/fhir/QuestionnaireResponse
    ProxyPassReverse /QuestionnaireResponse http://irccs-studio-clinico:8080/fhir/QuestionnaireResponse

    ProxyPass /PlanDefinition http://irccs-studio-clinico:8080/fhir/PlanDefinition
    ProxyPassReverse /PlanDefinition http://irccs-studio-clinico:8080/fhir/PlanDefinition

    ProxyPass /Procedure http://irccs-studio-clinico:8080/fhir/Procedure
    ProxyPassReverse /Procedure http://irccs-studio-clinico:8080/fhir/Procedure

