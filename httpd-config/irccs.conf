    ProxyPass /Encounter http://irccs-clinical-reasoning:8080/fhir/Encounter
    ProxyPassReverse /Encounter http://irccs-clinical-reasoning:8080/fhir/Encounter

    ProxyPass /Task http://irccs-studio-clinico:8080/fhir/Task
    ProxyPassReverse /Task http://irccs-studio-clinico:8080/fhir/Task

    ProxyPass /patients/questionnaire http://irccs-studio-clinico:8080/fhir/patients/questionnaire
    ProxyPassReverse /patients/questionnaire http://irccs-studio-clinico:8080/fhir/patients/questionnaire

    ProxyPass /patients/questionnaireResponse http://irccs-studio-clinico:8080/fhir/patients/questionnaireResponse
    ProxyPassReverse /patients/questionnaireResponse http://irccs-studio-clinico:8080/fhir/patients/questionnaireResponse

    ProxyPass /token/generate http://irccs-studio-clinico:8080/fhir/token/generate
    ProxyPassReverse /token/generate http://irccs-studio-clinico:8080/fhir/token/generate

    ProxyPass /dicom http://irccs-tac:8080/fhir/dicom
    ProxyPassReverse /dicom http://irccs-tac:8080/fhir/dicom

    ProxyPass /ImagingStudy http://irccs-tac:8080/fhir/ImagingStudy
    ProxyPassReverse /ImagingStudy http://irccs-tac:8080/fhir/ImagingStudy

    ProxyPass /DocumentReference http://irccs-tac:8080/fhir/DocumentReference
    ProxyPassReverse /DocumentReference http://irccs-tac:8080/fhir/DocumentReference

    # Microservizio irccs-zammad (API ticket/organizzazioni/gruppi/utenti Quarkus),
    # NON l'interfaccia web Zammad (quella e' su porta 8443, vedi zammad.conf).
    ProxyPass /zammad http://irccs-zammad:8080/fhir/zammad
    ProxyPassReverse /zammad http://irccs-zammad:8080/fhir/zammad

    RedirectMatch ^/docs$ /docs/
    ProxyPass /docs/ http://irccs-antora-docs/
    ProxyPassReverse /docs/ http://irccs-antora-docs/

    ProxyPass /Bundle http://irccs-studio-clinico:8080/fhir/Bundle
    ProxyPassReverse /Bundle http://irccs-studio-clinico:8080/fhir/Bundle

    ProxyPass /scan-session http://irccs-keycloak:8080/backoffice/realms/pascale/scan-session
    ProxyPassReverse /scan-session http://irccs-keycloak:8080/backoffice/realms/pascale/scan-session

    ProxyPass /patient-interview http://irccs-patient-interview:8080/api/patient-interview/v1
    ProxyPassReverse /patient-interview http://irccs-patient-interview:8080/api/patient-interview/v1

    ProxyPass /webpush http://irccs-webpush:8080/webpush
    ProxyPassReverse /webpush http://irccs-webpush:8080/webpush
    ProxyPass /test-pwa http://irccs-webpush:8080/test-pwa
    ProxyPassReverse /test-pwa http://irccs-webpush:8080/test-pwa

    ProxyPass /ValueSet http://irccs-studio-clinico:8080/fhir/ValueSet
    ProxyPassReverse /ValueSet http://irccs-studio-clinico:8080/fhir/ValueSet

    ProxyPass /CodeSystem http://irccs-studio-clinico:8080/fhir/CodeSystem
    ProxyPassReverse /CodeSystem http://irccs-studio-clinico:8080/fhir/CodeSystem

    # Grafana (stack monitoring, container su rete "irccs" condivisa). Auth
    # gestita da Grafana stesso (login richiesto, anonymous disabilitato).
    ProxyPass /grafana http://irccs-grafana:3000/grafana
    ProxyPassReverse /grafana http://irccs-grafana:3000/grafana

    # Faro collector (Alloy): riceve log/errori dal frontend React
    # (src/faro.ts). Porta 12347 = AGENT_PORT_APP_RECEIVER in .env, valore
    # fisso perche' Apache non puo' leggere le env var del compose monitoring.
    ProxyPass /faro-collector http://irccs-alloy:12347
    ProxyPassReverse /faro-collector http://irccs-alloy:12347

    # Zammad servito su porta dedicata 8443, stesso hostname: vedi conf/sites/zammad.conf

</VirtualHost>
