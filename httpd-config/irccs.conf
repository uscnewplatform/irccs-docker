    ProxyPassReverse /AdverseEvent http://irccs-anagrafica-pazienti:8080/fhir/AdverseEvent

    ProxyPass /Consent http://irccs-anagrafica-pazienti:8080/fhir/Consent
    ProxyPassReverse /Consent http://irccs-anagrafica-pazienti:8080/fhir/Consent

    ProxyPass /Encounter http://irccs-clinical-reasoning:8080/fhir/Encounter
    ProxyPassReverse /Encounter http://irccs-clinical-reasoning:8080/fhir/Encounter

    ProxyPass /Task http://irccs-studio-clinico:8080/fhir/Task
    ProxyPassReverse /Task http://irccs-studio-clinico:8080/fhir/Task

    ProxyPass /patients/questionnaire http://irccs-studio-clinico:8080/fhir/patients/questionnaire
    ProxyPassReverse /patients/questionnaire http://irccs-studio-clinico:8080/fhir/patients/questionnaire

    ProxyPass /patients/questionnaireResponse http://irccs-studio-clinico:8080/fhir/patients/questionnaireResponse
    ProxyPassReverse /patients/questionnaireResponse http://irccs-studio-clinico:8080/fhir/patients/questionnaireResponse

    ProxyPass /token/generate http://irccs-studio-clinico:8080/fhir/token/generate
    ProxyPassReverse /token/generate http://irccs-studio-clinico:8080/fhir/token/generate

    ProxyPass /dicom http://irccs-tac:8080/fhir/dicom
    ProxyPassReverse /dicom http://irccs-tac:8080/fhir/dicom

    ProxyPass /ImagingStudy http://irccs-tac:8080/fhir/ImagingStudy
    ProxyPassReverse /ImagingStudy http://irccs-tac:8080/fhir/ImagingStudy

    ProxyPass /DocumentReference http://irccs-tac:8080/fhir/DocumentReference
    ProxyPassReverse /DocumentReference http://irccs-tac:8080/fhir/DocumentReference

    ProxyPass /zammad http://irccs-zammad:8080/fhir/zammad
    ProxyPassReverse /zammad http://irccs-zammad:8080/fhir/zammad

    RedirectMatch ^/docs$ /docs/
    ProxyPass /docs/ http://irccs-antora-docs/
    ProxyPassReverse /docs/ http://irccs-antora-docs/

    ProxyPass /Bundle http://irccs-studio-clinico:8080/fhir/Bundle
    ProxyPassReverse /Bundle http://irccs-studio-clinico:8080/fhir/Bundle

    ProxyPass /scan-session http://irccs-keycloak:8080/backoffice/realms/pascale/scan-session
    ProxyPassReverse /scan-session http://irccs-keycloak:8080/backoffice/realms/pascale/scan-session

    ProxyPass /patient-interview http://irccs-patient-interview:8080/api/patient-interview/v1
    ProxyPassReverse /patient-interview http://irccs-patient-interview:8080/api/patient-interview/v1

    ProxyPass /webpush http://irccs-webpush:8080/webpush
    ProxyPassReverse /webpush http://irccs-webpush:8080/webpush
    ProxyPass /test-pwa http://irccs-webpush:8080/test-pwa
    ProxyPassReverse /test-pwa http://irccs-webpush:8080/test-pwa

    ProxyPass /ValueSet http://irccs-studio-clinico:8080/fhir/ValueSet
    ProxyPassReverse /ValueSet http://irccs-studio-clinico:8080/fhir/ValueSet

    ProxyPass /CodeSystem http://irccs-studio-clinico:8080/fhir/CodeSystem
    ProxyPassReverse /CodeSystem http://irccs-studio-clinico:8080/fhir/CodeSystem

    # ===== ZAMMAD (sub-path forzato: no DNS dedicato disponibile) =====
    # ATTENZIONE: Zammad non supporta ufficialmente il deploy sotto sub-path.
    # Asset/API usano path assoluti da root (es. /assets/..., /api/v1/...,
    # /ws, /cable), quindi vanno proxati QUI fuori dal prefisso /zammad-ui/,
    # non solo sotto di esso.
    #
    # Si punta DIRETTO a zammad-railsserver (Puma), NON al nginx interno
    # dell'immagine ufficiale Zammad (zammad-nginx): quel nginx fa sempre
    # `proxy_set_header X-Forwarded-Proto $scheme;`, quindi sovrascrive con
    # lo scheme locale (http, dato che il salto Apache->nginx e' plain http)
    # buttando via l'X-Forwarded-Proto: https che Apache aveva gia' messo.
    # Risultato: Rack::Session vede request.scheme=http mentre
    # Setting.http_type=https, il check secure_flag? fallisce, il cookie di
    # sessione non viene mai confermato -> "CSRF token verification failed"
    # persistente (verificato: la sessione viene scritta lato DB, il cookie
    # semplicemente non torna mai al browser). Puma legge X-Forwarded-Proto
    # senza riscriverlo, quindi qui va bene diretto.

    # Websocket upgrade Zammad (container zammad-websocket separato, non railsserver)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://irccs-zammad-websocket:6042/ws [P,L]

    # /assets, /manifest.json, /apple-touch-icon.png sono path generici usati ANCHE
    # dalla dashboard React su questo stesso host (build Vite: ./assets/index-*.js,
    # ./manifest.json). Un ProxyPass secco su questi path dirotta sempre tutto verso
    # Zammad e rompe il caricamento JS/CSS della dashboard (schermata bianca, login
    # impossibile). Si instrada verso Zammad SOLO se la richiesta arriva da una pagina
    # sotto /zammad-ui/ (Referer), altrimenti passa al filesystem/altra ProxyPass.
    RewriteCond %{HTTP_REFERER} /zammad-ui/ [NC]
    RewriteRule ^/assets/(.*)$ http://irccs-zammad-railsserver:3000/assets/$1 [P,L]
    ProxyPassReverse /assets http://irccs-zammad-railsserver:3000/assets

    RewriteCond %{HTTP_REFERER} /zammad-ui/ [NC]
    RewriteRule ^/manifest\.json$ http://irccs-zammad-railsserver:3000/manifest.json [P,L]
    ProxyPassReverse /manifest.json http://irccs-zammad-railsserver:3000/manifest.json

    RewriteCond %{HTTP_REFERER} /zammad-ui/ [NC]
    RewriteRule ^/apple-touch-icon\.png$ http://irccs-zammad-railsserver:3000/apple-touch-icon.png [P,L]
    ProxyPassReverse /apple-touch-icon.png http://irccs-zammad-railsserver:3000/apple-touch-icon.png

    ProxyPass /cable http://irccs-zammad-railsserver:3000/cable
    ProxyPassReverse /cable http://irccs-zammad-railsserver:3000/cable

    ProxyPass /api/v1 http://irccs-zammad-railsserver:3000/api/v1
    ProxyPassReverse /api/v1 http://irccs-zammad-railsserver:3000/api/v1

    ProxyPass /zammad-ui/ http://irccs-zammad-railsserver:3000/
    ProxyPassReverse /zammad-ui/ http://irccs-zammad-railsserver:3000/

</VirtualHost>
