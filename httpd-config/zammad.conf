# Vhost Zammad. Nome host da ZAMMAD_SERVER_NAME (env del container irccs-httpd).
# Come il vhost dashboard (irccs.conf) ascolta in HTTP sulla porta 80: il TLS e' terminato a monte
# (VIP/load balancer) che passa X-Forwarded-Proto: https. Vhost nominale: risponde solo se l'Host
# della richiesta coincide con ZAMMAD_SERVER_NAME, tutto il resto resta al vhost dashboard.
<VirtualHost *:80 *:8989>
    ServerName ${ZAMMAD_SERVER_NAME}
    ServerAdmin gennaro.aurilia@infocube.it

    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog logs/zammad-error.log
    CustomLog logs/zammad-access.log combined

    LimitRequestBody 1073741824

    # ===== MANUTENZIONE PROGRAMMATA =====
    # Stesso flag della dashboard (irccs.conf): se .maintenance-flag e' non
    # vuoto, anche Zammad risponde 503 + maintenance.html. Deve stare PRIMA
    # della regola websocket e dei ProxyPass. Vedi host-maintenance/README-maintenance.md
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/maintenance\.html$
    RewriteCond "%{DOCUMENT_ROOT}/.maintenance-flag" -s
    RewriteRule ^ - [R=503,L]
    ErrorDocument 503 /maintenance.html
    <IfModule mod_headers.c>
        <Files "maintenance.html">
            Header always set Retry-After "3600"
        </Files>
    </IfModule>

    # Le intestazioni di identita' non devono mai arrivare dal client (Zammad le accetterebbe se il
    # Single Sign-On fosse attivo): le toglie sempre Apache.
    RequestHeader unset X-Forwarded-User
    RequestHeader unset Remote-User
    RequestHeader unset REMOTE_USER

    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://irccs-zammad-websocket:6042/ws [P,L]

    # La pagina di manutenzione e' servita da htdocs, non da Rails
    ProxyPass /maintenance.html !

    ProxyPass /cable http://irccs-zammad-railsserver:3000/cable
    ProxyPassReverse /cable http://irccs-zammad-railsserver:3000/cable

    ProxyPass / http://irccs-zammad-railsserver:3000/
    ProxyPassReverse / http://irccs-zammad-railsserver:3000/
</VirtualHost>
