<VirtualHost *:443>
    # Sottodominio dedicato su porta 443 (stessa porta gia' aperta a firewall/VIP
    # per la dashboard). Sostituisce la vecchia porta 8443 dedicata, non piu'
    # raggiungibile dall'esterno per problema di rete/firewall perimetrale.
    ServerName pj-tk.istitutotumori.na.it
    ServerAdmin gennaro.aurilia@infocube.it

    # TLS terminato qui da Apache (stesso certificato del vhost dashboard, irccs.conf):
    # su porta 443 con piu' vhost nominali serve SSLEngine on anche su questo,
    # altrimenti AH02032 "no compatible SSL setup" (HTTP/2 connection reuse,
    # client senza SNI) e il browser riceve un errore sul sito Zammad.
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/ssl/cert-pasc-2026.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/ssl/cert-pasc-2026.key

    SSLProxyEngine on
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog logs/zammad-error.log
    CustomLog logs/zammad-access.log combined

    LimitRequestBody 1073741824

    # ===== MANUTENZIONE PROGRAMMATA =====
    # Stesso flag della dashboard (irccs.conf): se .maintenance-flag e' non
    # vuoto, anche Zammad risponde 503 + maintenance.html. Deve stare PRIMA
    # della regola websocket e dei ProxyPass. Vedi host-maintenance/README-maintenance.md
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/maintenance\.html$
    RewriteCond "%{DOCUMENT_ROOT}/.maintenance-flag" -s
    RewriteRule ^ - [R=503,L]
    ErrorDocument 503 /maintenance.html
    <IfModule mod_headers.c>
        <Files "maintenance.html">
            Header always set Retry-After "3600"
        </Files>
    </IfModule>

    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://irccs-zammad-websocket:6042/ws [P,L]

    # La pagina di manutenzione e' servita da htdocs, non da Rails
    ProxyPass /maintenance.html !

    ProxyPass /cable http://irccs-zammad-railsserver:3000/cable
    ProxyPassReverse /cable http://irccs-zammad-railsserver:3000/cable

    ProxyPass / http://irccs-zammad-railsserver:3000/
    ProxyPassReverse / http://irccs-zammad-railsserver:3000/
</VirtualHost>
