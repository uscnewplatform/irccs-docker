<VirtualHost *:443>
    # Sottodominio dedicato su porta 443 (stessa porta gia' aperta a firewall/VIP
    # per la dashboard). Sostituisce la vecchia porta 8443 dedicata, non piu'
    # raggiungibile dall'esterno per problema di rete/firewall perimetrale.
    ServerName pj-tk.istitutotumori.na.it
    ServerAdmin gennaro.aurilia@infocube.it

    # SSL disattivato qui: nessun certificato configurato su questo vhost, il
    # traffico su :443 e' servito in chiaro (HTTP). Presuppone che TLS sia
    # terminato altrove (LB/reverse proxy esterno) prima di arrivare qui -
    # altrimenti il client vedrebbe un handshake TLS fallire, non un sito HTTP.
    #SSLEngine on
    #SSLCertificateFile /usr/local/apache2/conf/ssl/cert-pasc-2026.crt
    #SSLCertificateKeyFile /usr/local/apache2/conf/ssl/cert-pasc-2026.key

    #SSLProxyEngine on
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog logs/zammad-error.log
    CustomLog logs/zammad-access.log combined

    LimitRequestBody 1073741824

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://irccs-zammad-websocket:6042/ws [P,L]

    ProxyPass /cable http://irccs-zammad-railsserver:3000/cable
    ProxyPassReverse /cable http://irccs-zammad-railsserver:3000/cable

    ProxyPass / http://irccs-zammad-railsserver:3000/
    ProxyPassReverse / http://irccs-zammad-railsserver:3000/
</VirtualHost>
