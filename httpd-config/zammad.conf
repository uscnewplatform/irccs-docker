<VirtualHost *:8443>
    ServerName pj.istitutotumori.na.it
    ServerAdmin gennaro.aurilia@infocube.it

    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/ssl/cert-pasc-2026.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/ssl/cert-pasc-2026.key

    SSLProxyEngine on
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8443"

    ErrorLog logs/zammad-error.log
    CustomLog logs/zammad-access.log combined

    LimitRequestBody 1073741824

    # Porta dedicata sullo stesso hostname (no DNS extra): Zammad gira in root "/"
    # del proprio origin (host:8443), niente hack sub-path/referer necessari.

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://irccs-zammad-websocket:6042/ws [P,L]

    ProxyPass /cable http://irccs-zammad-railsserver:3000/cable
    ProxyPassReverse /cable http://irccs-zammad-railsserver:3000/cable

    ProxyPass / http://irccs-zammad-railsserver:3000/
    ProxyPassReverse / http://irccs-zammad-railsserver:3000/
</VirtualHost>
