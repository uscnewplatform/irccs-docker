<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manutenzione in corso</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f2942;
    color: #f2f5f7;
  }
  .wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 480px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
  }
  p {
    font-size: 1rem;
    line-height: 1.5;
    opacity: 0.85;
  }
  .icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">&#128295;</div>
      <h1>Sito temporaneamente in manutenzione</h1>
      <p>Stiamo effettuando un aggiornamento programmato del sistema.<br>
      Il servizio tornera' disponibile a breve. Ci scusiamo per il disagio.</p>
    </div>
  </div>
</body>
</html>
