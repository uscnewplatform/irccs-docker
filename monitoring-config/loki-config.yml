auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  instance_interface_names:
    - "eth0"
  ring:
    kvstore:
      store: inmemory
    instance_interface_names:
    - "eth0"

schema_config:
  configs:
    - from: 2023-07-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 360h
  max_query_series: 100000
  max_query_parallelism: 2
  volume_enabled: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

# Il compactor applica davvero retention_period (senza, i chunk restano su
# disco all'infinito anche se la config dichiara 360h).
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Alerting gestito da Grafana unified alerting (vedi monitoring-config/alerting/),
# non serve un Alertmanager esterno / Loki ruler separato.

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/usagestats/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
