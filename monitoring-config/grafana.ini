[analytics]
reporting_enabled = false

[server]
protocol = http
domain = $__env{GRAFANA_DOMAIN}
# http, non https: irccs.conf serve il proxy /grafana su *:80 in chiaro (vedi
# httpd-config/irccs.conf) - root_url su https qui produceva "origin not allowed"
# al login/su ogni chiamata API, perche' l'Origin del browser (http://...) non
# corrispondeva mai a quello atteso da Grafana. Se in futuro httpd viene messo
# dietro TLS (terminato qui o a monte), aggiornare a https.
root_url = http://%(domain)s/grafana/
serve_from_sub_path = true

[auth.anonymous]
enabled = false

[security]
disable_initial_admin_creation = false

[explore]
enabled = true

[users]
default_theme = dark

[feature_toggles]
enable = tempoServiceGraph tempoSearch tempoBackendSearch traceToMetrics traceqlEditor topNav

[plugins]
allow_loading_unsigned_plugins = grafana-kowalski-app

[smtp]
enabled = true
host = $__env{GF_SMTP_HOST}
from_address = $__env{GF_SMTP_FROM}
skip_verify = true
