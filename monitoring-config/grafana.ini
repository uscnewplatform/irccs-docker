[analytics]
reporting_enabled = false

[server]
protocol = http
domain = $__env{GRAFANA_DOMAIN}
# root_url interamente da env (GRAFANA_ROOT_URL): deve combaciare ESATTAMENTE
# con l'URL/protocollo/subpath che il browser usa davvero, altrimenti Grafana
# rifiuta login e ogni azione che scrive con "origin not allowed" (i GET
# passano comunque, da cui la falsa impressione "quasi funziona"). Due casi
# tipici, vedi .env_example:
#   - via proxy httpd (TLS terminato a monte):
#     GRAFANA_ROOT_URL=https://irccs.preprod.infocube.it/grafana/
#     (serve anche ProxyPreserveHost On + X-Forwarded-Proto https sul
#     ProxyPass /grafana in httpd-config/irccs.conf - gia' impostato)
#   - via porta diretta, bypassando il proxy (debug/isolamento):
#     GRAFANA_ROOT_URL=http://10.99.88.240:3001/
root_url = $__env{GRAFANA_ROOT_URL}
serve_from_sub_path = $__env{GRAFANA_SERVE_FROM_SUB_PATH}

[auth.anonymous]
enabled = false

[security]
disable_initial_admin_creation = false

[explore]
enabled = true

[users]
default_theme = dark

[feature_toggles]
enable = tempoServiceGraph tempoSearch tempoBackendSearch traceToMetrics traceqlEditor topNav

[plugins]
allow_loading_unsigned_plugins = grafana-kowalski-app

[smtp]
enabled = true
host = $__env{GF_SMTP_HOST}
from_address = $__env{GF_SMTP_FROM}
skip_verify = true
