[analytics]
reporting_enabled = false

[server]
protocol = http
domain = $__env{GRAFANA_DOMAIN}
# https: httpd serve *:80 in chiaro ma c'e' un TLS termination a monte
# (load balancer/reverse proxy esterno) - l'utente finale accede sempre in
# https (verificato: https://irccs.preprod.infocube.it/grafana/). La vera
# causa di "origin not allowed" era GRAFANA_DOMAIN assente in .env (root_url
# diventava "http:///grafana/", dominio vuoto) - vedi .env_example.
root_url = https://%(domain)s/grafana/
serve_from_sub_path = true

[auth.anonymous]
enabled = false

[security]
disable_initial_admin_creation = false

[explore]
enabled = true

[users]
default_theme = dark

[feature_toggles]
enable = tempoServiceGraph tempoSearch tempoBackendSearch traceToMetrics traceqlEditor topNav

[plugins]
allow_loading_unsigned_plugins = grafana-kowalski-app

[smtp]
enabled = true
host = $__env{GF_SMTP_HOST}
from_address = $__env{GF_SMTP_FROM}
skip_verify = true
